baseURL = 'https://kenjiusui.github.io/blog/'
locale = 'ja'
title = 'my blog'
theme = "PaperMod"
metaDataFormat = 'yaml'

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.profileMode]
    enabled = true
    title = "Welcome"
    subtitle = "データ分析・データ基盤について書いているブログです。(仮の紹介文です。後で編集してください)"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/posts/"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/grahamian.bsky.social"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/kenji-usui-b9080b150/"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 30
