baseURL = 'https://kenjiusui.github.io/blog/'
locale = 'ja'
title = 'Think and Write'
theme = "PaperMod"
metaDataFormat = 'yaml'
ignoreFiles = ['CLAUDE\.md$']

[params]
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.profileMode]
    enabled = true
    title = "考えたら書く"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/grahamian.bsky.social"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/kenji-usui-b9080b150/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/kenjiusui"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "books"
  name = "Books"
  url = "/books/"
  weight = 15

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 5

[services]
  [services.googleAnalytics]
    ID = "G-HV90P77G6C"
