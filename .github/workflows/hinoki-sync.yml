name: Sync to standard.site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "hinoki-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install hinoki
        run: go install github.com/harutsugegusa/hinoki/cmd/hinoki@latest

      - name: Sync
        env:
          HINOKI_APP_PASSWORD: ${{ secrets.HINOKI_APP_PASSWORD }}
        run: hinoki sync

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- hinoki.yaml .hinoki-state.json; then
            git add hinoki.yaml .hinoki-state.json
            git commit -m "chore: update hinoki sync state [skip ci]"
            git push
          fi
